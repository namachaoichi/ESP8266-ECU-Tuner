<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECU Tuner Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #667eea; font-size: 28px; }
        .status {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .status-item {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        .status-item.ok { background: #e8f5e9; color: #2e7d32; }
        .status-item.warn { background: #fff3e0; color: #e65100; }
        .status-item.error { background: #ffebee; color: #c62828; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .tab-btn:hover { background: #555; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .gauge-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .gauge-card h3 { font-size: 14px; color: #999; margin-bottom: 10px; text-transform: uppercase; }
        .gauge-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .gauge-unit { font-size: 12px; color: #999; }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        .table-selector {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .table-selector button {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .table-selector button.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th { background: #f5f5f5; font-weight: 600; color: #333; }
        td { background: #fafafa; }
        input[type="number"] {
            width: 100%;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 11px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 3px #667eea;
        }
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .config-group {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .config-group h3 { margin-bottom: 15px; color: #667eea; font-size: 16px; }
        .config-item {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .config-item label { font-size: 12px; color: #999; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .config-item input,
        .config-item select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .config-item input:focus,
        .config-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 3px #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5568d3; }
        .btn-success {
            background: #4caf50;
            color: white;
        }
        .btn-success:hover { background: #45a049; }
        .btn-danger {
            background: #f44336;
            color: white;
        }
        .btn-danger:hover { background: #da190b; }
        .btn-warning {
            background: #ff9800;
            color: white;
        }
        .btn-warning:hover { background: #e68900; }
        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        .message.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }
        .footer {
            text-align: center;
            color: white;
            font-size: 12px;
            margin-top: 20px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 ECU Tuner</h1>
            <div class="status">
                <div id="statusConn" class="status-item">Disconnected</div>
                <div id="statusRPM" class="status-item ok">RPM: 0</div>
                <div id="statusEngine" class="status-item">Stopped</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('tables')">Tune Tables</button>
            <button class="tab-btn" onclick="switchTab('config')">Configuration</button>
            <button class="tab-btn" onclick="switchTab('log')">Log</button>
        </div>

        <!-- DASHBOARD TAB -->
        <div id="dashboard" class="tab-content active">
            <div id="message"></div>
            <div class="dashboard-grid">
                <div class="gauge-card">
                    <h3>Engine Speed</h3>
                    <div class="gauge-value" id="valRPM">0</div>
                    <div class="gauge-unit">RPM</div>
                </div>
                <div class="gauge-card">
                    <h3>Manifold Pressure</h3>
                    <div class="gauge-value" id="valMAP">0</div>
                    <div class="gauge-unit">kPa</div>
                </div>
                <div class="gauge-card">
                    <h3>Throttle Position</h3>
                    <div class="gauge-value" id="valTPS">0</div>
                    <div class="gauge-unit">%</div>
                </div>
                <div class="gauge-card">
                    <h3>Coolant Temp</h3>
                    <div class="gauge-value" id="valCLT">0</div>
                    <div class="gauge-unit">°C</div>
                </div>
                <div class="gauge-card">
                    <h3>Spark Advance</h3>
                    <div class="gauge-value" id="valAdvance">0</div>
                    <div class="gauge-unit">°BTDC</div>
                </div>
                <div class="gauge-card">
                    <h3>Pulse Width</h3>
                    <div class="gauge-value" id="valPW">0</div>
                    <div class="gauge-unit">ms</div>
                </div>
            </div>
        </div>

        <!-- TABLES TAB -->
        <div id="tables" class="tab-content">
            <div class="table-container">
                <div class="table-selector">
                    <button class="active" onclick="selectTable('spark')">Spark Advance</button>
                    <button onclick="selectTable('ve')">Volumetric Efficiency</button>
                    <button onclick="selectTable('afr')">AFR Target</button>
                </div>
                <div id="tableWrapper">
                    <div class="loader"></div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="downloadTable()">Download</button>
                    <button class="btn-success" onclick="saveTable()">Save to ECU</button>
                    <button class="btn-warning" onclick="resetTable()">Reset to Default</button>
                </div>
            </div>
        </div>

        <!-- CONFIG TAB -->
        <div id="config" class="tab-content">
            <div class="control-panel">
                <div class="config-group">
                    <h3>Engine Setup</h3>
                    <div class="config-item">
                        <label>Number of Cylinders</label>
                        <select id="cfgCylinders">
                            <option value="4">4 Cylinders</option>
                            <option value="6">6 Cylinders</option>
                            <option value="8">8 Cylinders</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>Ignition Type</label>
                        <select id="cfgIgnition">
                            <option value="0">Wasted Spark</option>
                            <option value="1">Direct Coil</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>Fuel Injection</label>
                        <select id="cfgFuel">
                            <option value="0">Batch</option>
                            <option value="1">Sequential</option>
                        </select>
                    </div>
                </div>

                <div class="config-group">
                    <h3>Spark Limits</h3>
                    <div class="config-item">
                        <label>Min Advance (°)</label>
                        <input type="number" id="cfgAdvMin" step="0.1" min="-45" max="0">
                    </div>
                    <div class="config-item">
                        <label>Max Advance (°)</label>
                        <input type="number" id="cfgAdvMax" step="0.1" min="0" max="50">
                    </div>
                    <div class="config-item">
                        <label>Max Dwell (ms)</label>
                        <input type="number" id="cfgDwellMax" step="0.1" min="1" max="10">
                    </div>
                </div>

                <div class="config-group">
                    <h3>Fuel Limits</h3>
                    <div class="config-item">
                        <label>Min Pulse Width (µs)</label>
                        <input type="number" id="cfgPWMin" min="500" max="5000">
                    </div>
                    <div class="config-item">
                        <label>Max Pulse Width (µs)</label>
                        <input type="number" id="cfgPWMax" min="5000" max="25000">
                    </div>
                    <div class="config-item">
                        <label>Injector Dead Time (µs)</label>
                        <input type="number" id="cfgDeadTime" step="0.1" min="0" max="2000">
                    </div>
                </div>

                <div class="config-group">
                    <h3>Sensor Calibration</h3>
                    <div class="config-item">
                        <label>MAP Min (kPa)</label>
                        <input type="number" id="cfgMapMin" min="0" max="50">
                    </div>
                    <div class="config-item">
                        <label>MAP Max (kPa)</label>
                        <input type="number" id="cfgMapMax" min="50" max="300">
                    </div>
                    <div class="config-item">
                        <label>TPS Min (%)</label>
                        <input type="number" id="cfgTpsMin" min="0" max="100">
                    </div>
                    <div class="config-item">
                        <label>TPS Max (%)</label>
                        <input type="number" id="cfgTpsMax" min="0" max="100">
                    </div>
                </div>
            </div>
            <div class="button-group" style="margin-top: 20px;">
                <button class="btn-primary" onclick="loadConfig()">Load from ECU</button>
                <button class="btn-success" onclick="saveConfig()">Save to ECU</button>
                <button class="btn-danger" onclick="resetConfig()">Reset to Default</button>
            </div>
        </div>

        <!-- LOG TAB -->
        <div id="log" class="tab-content">
            <div class="table-container">
                <textarea id="logViewer" style="width: 100%; height: 400px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 12px;" readonly></textarea>
                <div class="button-group" style="margin-top: 10px;">
                    <button class="btn-primary" onclick="clearLog()">Clear Log</button>
                    <button class="btn-warning" onclick="downloadLog()">Download</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>ECU Tuner v1.0 | Connect via Serial @ 115200 baud</p>
    </div>

    <script>
        // Global state
        let g_socket = null;
        let g_connected = false;
        let g_currentTable = 'spark';
        let g_tables = { spark: null, ve: null, afr: null };
        let g_config = null;
        let g_state = {};
        let g_log = [];

        // Initialize on page load
        window.addEventListener('load', () => {
            initWebSocket();
            setInterval(updateDashboard, 500);
            setInterval(sendHeartbeat, 2000);
        });

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'tables' && g_tables.spark === null) {
                loadTable();
            }
            if (tab === 'config' && g_config === null) {
                loadConfig();
            }
        }

        // WebSocket communication
        function initWebSocket() {
            if ('WebSocket' in window) {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                g_socket = new WebSocket(protocol + '//' + window.location.host + '/ws');
                g_socket.onopen = () => { g_connected = true; updateStatus(); };
                g_socket.onmessage = (e) => handleMessage(JSON.parse(e.data));
                g_socket.onclose = () => { g_connected = false; updateStatus(); setTimeout(initWebSocket, 2000); };
                g_socket.onerror = (e) => showMessage('Connection error: ' + e, 'error');
            } else {
                showMessage('WebSocket not supported', 'error');
            }
        }

        function sendCommand(cmd) {
            if (!g_connected) { showMessage('Not connected to ECU', 'error'); return; }
            g_socket.send(JSON.stringify(cmd));
        }

        function handleMessage(msg) {
            if (msg.type === 'state') { g_state = msg.data; }
            if (msg.type === 'table') { g_tables[msg.name] = msg.data; renderTable(); }
            if (msg.type === 'config') { g_config = msg.data; updateConfigUI(); }
            if (msg.type === 'log') { g_log.push(msg.data); updateLogViewer(); }
        }

        function updateDashboard() {
            if (!g_connected) return;
            document.getElementById('valRPM').textContent = (g_state.rpm || 0).toFixed(0);
            document.getElementById('valMAP').textContent = (g_state.map || 0).toFixed(1);
            document.getElementById('valTPS').textContent = (g_state.tps || 0).toFixed(1);
            document.getElementById('valCLT').textContent = (g_state.clt || 0).toFixed(1);
            document.getElementById('valAdvance').textContent = (g_state.advance || 0).toFixed(1);
            document.getElementById('valPW').textContent = ((g_state.pw || 0) / 1000).toFixed(2);
        }

        function updateStatus() {
            document.getElementById('statusConn').textContent = g_connected ? '✓ Connected' : '✗ Disconnected';
            document.getElementById('statusConn').className = g_connected ? 'status-item ok' : 'status-item error';
        }

        function sendHeartbeat() {
            if (g_connected) sendCommand({ cmd: 'get_state' });
        }

        // Table functions
        function selectTable(name) {
            g_currentTable = name;
            document.querySelectorAll('.table-selector button').forEach((btn, i) => {
                btn.classList.toggle('active', ['spark', 've', 'afr'][i] === name);
            });
            if (g_tables[name] === null) loadTable();
            else renderTable();
        }

        function loadTable() {
            sendCommand({ cmd: 'get_table', table: g_currentTable });
        }

        function renderTable() {
            if (!g_tables[g_currentTable]) return;
            const data = g_tables[g_currentTable];
            let html = '<table><tr><th>RPM/MAP</th>';
            for (let col = 0; col < data[0].length; col++) html += '<th>' + (col * 20) + ' kPa</th>';
            html += '</tr>';
            for (let row = 0; row < data.length; row++) {
                html += '<tr><td>' + (row * 200) + '</td>';
                for (let col = 0; col < data[row].length; col++) {
                    html += '<td><input type="number" value="' + data[row][col].toFixed(1) + '" onchange="updateCell(' + row + ',' + col + ',this.value)"></td>';
                }
                html += '</tr>';
            }
            html += '</table>';
            document.getElementById('tableWrapper').innerHTML = html;
        }

        function updateCell(row, col, value) {
            if (g_tables[g_currentTable]) g_tables[g_currentTable][row][col] = parseFloat(value);
        }

        function saveTable() {
            sendCommand({ cmd: 'set_table', table: g_currentTable, data: g_tables[g_currentTable] });
            showMessage('Table saved to ECU', 'success');
        }

        function downloadTable() {
            const json = JSON.stringify(g_tables[g_currentTable], null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = g_currentTable + '_table.json';
            a.click();
        }

        function resetTable() {
            if (confirm('Reset ' + g_currentTable + ' table to default?')) {
                sendCommand({ cmd: 'reset_table', table: g_currentTable });
            }
        }

        // Config functions
        function loadConfig() {
            sendCommand({ cmd: 'get_config' });
        }

        function saveConfig() {
            const config = {
                cylinders: document.getElementById('cfgCylinders').value,
                ignition: parseInt(document.getElementById('cfgIgnition').value),
                fuel: parseInt(document.getElementById('cfgFuel').value),
                advMin: parseFloat(document.getElementById('cfgAdvMin').value),
                advMax: parseFloat(document.getElementById('cfgAdvMax').value),
                dwellMax: parseFloat(document.getElementById('cfgDwellMax').value),
                pwMin: parseInt(document.getElementById('cfgPWMin').value),
                pwMax: parseInt(document.getElementById('cfgPWMax').value),
                deadTime: parseFloat(document.getElementById('cfgDeadTime').value),
                mapMin: parseInt(document.getElementById('cfgMapMin').value),
                mapMax: parseInt(document.getElementById('cfgMapMax').value),
                tpsMin: parseInt(document.getElementById('cfgTpsMin').value),
                tpsMax: parseInt(document.getElementById('cfgTpsMax').value)
            };
            sendCommand({ cmd: 'set_config', data: config });
            showMessage('Configuration saved to ECU', 'success');
        }

        function updateConfigUI() {
            if (!g_config) return;
            document.getElementById('cfgCylinders').value = g_config.cylinders;
            document.getElementById('cfgIgnition').value = g_config.ignition;
            document.getElementById('cfgFuel').value = g_config.fuel;
            document.getElementById('cfgAdvMin').value = g_config.advMin;
            document.getElementById('cfgAdvMax').value = g_config.advMax;
            document.getElementById('cfgDwellMax').value = g_config.dwellMax;
            document.getElementById('cfgPWMin').value = g_config.pwMin;
            document.getElementById('cfgPWMax').value = g_config.pwMax;
            document.getElementById('cfgDeadTime').value = g_config.deadTime;
            document.getElementById('cfgMapMin').value = g_config.mapMin;
            document.getElementById('cfgMapMax').value = g_config.mapMax;
            document.getElementById('cfgTpsMin').value = g_config.tpsMin;
            document.getElementById('cfgTpsMax').value = g_config.tpsMax;
        }

        function resetConfig() {
            if (confirm('Reset configuration to default?')) {
                sendCommand({ cmd: 'reset_config' });
                showMessage('Configuration reset to default', 'info');
            }
        }

        // Log functions
        function updateLogViewer() {
            document.getElementById('logViewer').textContent = g_log.join('\n');
            document.getElementById('logViewer').scrollTop = document.getElementById('logViewer').scrollHeight;
        }

        function clearLog() {
            g_log = [];
            updateLogViewer();
        }

        function downloadLog() {
            const blob = new Blob([g_log.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ecu_log.txt';
            a.click();
        }

        // Utility
        function showMessage(text, type = 'info') {
            const div = document.getElementById('message');
            div.innerHTML = '<div class="message ' + type + '">' + text + '</div>';
            setTimeout(() => { div.innerHTML = ''; }, 3000);
        }
    </script>
</body>
</html>
